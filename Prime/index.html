<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Energiezukunft – Startseite</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- Kopfzeile / Navigation -->
    <header>
        <div class="logo">
            <img src="Images/logo_Prime1.png" alt="Logo Prime" />
        </div>
        <nav>
            <ul>
                <li><a href="#">Kunde</a></li>
                <li><a href="#">Mitglied</a></li>
                <li><a href="#">Kontakt</a></li>
            </ul>
        </nav>
    </header>

    <!-- Hauptbereich mit Video (genau zwischen den beiden Leisten) -->
    <section class="hero">
        <video autoplay muted loop playsinline>
            <source src="Videos/Prime.mp4" type="video/mp4" />
            Ihr Browser unterstützt dieses Video nicht.
        </video>

        <div class="overlay">
            <h1>
                <span class="white">Bauen wir gemeinsam</span><br />
                <span class="green">Ihre Energiezukunft.</span>
            </h1>
            <div class="buttons">
                <a href="#" class="btn">Mehr erfahren</a>
                <a href="#" class="btn btn-secondary">Kontaktieren Sie uns</a>
            </div>
        </div>
    </section>

    <!-- Fusszeile / Barre en bas -->
    <footer>
        <p>Mit Ihnen überall</p>
    </footer>

    <script src="main.js"></script>
</body>
</html>
